# ===================================================================
# E-Ticaret Projesi - Uygulama Konfigürasyonu
# ===================================================================

spring.application.name=ecommerce-backend

# --- Veritabanı & JPA ---
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerceBackendDB
spring.datasource.username=${DB_USER:postgres}
# Sunucuda ortam değişkeni (DB_PASSWORD) olarak ayarlanmalı. Lokal için varsayılan değer kullanılır.
spring.datasource.password=${DB_PASSWORD:4496}
spring.datasource.driver-class-name=org.postgresql.Driver

# 'validate': Mevcut şemayı doğrular, production için güvenlidir.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Bean Validation kullandığımız için JPA'nın kendi doğrulamasını devre dışı bırak.
spring.jpa.properties.jakarta.persistence.validation.mode=none

# --- Veritabanı Migrasyonu (Liquibase) ---
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# --- Uygulama Ayarları ---
app.tax.vat-rate=0.20
app.return.period-days=14

# --- Güvenlik (JWT) ---
# Sunucuda ortam değişkeni (JWT_SECRET_KEY) olarak ayarlanmalı. Lokal için varsayılan değer kullanılır.
application.security.jwt.secret-key=${JWT_SECRET_KEY:NDI0NzI0NDI2NDU3NjE1MTMyMzUzMjM1MzQ2MTM3MzQzNTY0MzczNDM0MzczNTY0MzczNDY0MzczNDYxMzI2NDY0MzczNDY0MzczNDYxMzIzNTY0MzczNDY0MzczNDYxMzIzNDY0MzczNA==}
application.security.jwt.expiration=24h
application.security.jwt.refresh-token.expiration=7d

# --- Önbellekleme (Redis) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=your_redis_password

spring.cache.type=redis
spring.cache.redis.key-prefix=ecommerceApp::
spring.cache.redis.time-to-live=10m
# null değerler önbelleğe alınmasın.
spring.cache.redis.cache-null-values=false

# --- Mesajlaşma (Kafka) ---
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Mesajların tekrarlı gönderimini engeller.
spring.kafka.producer.properties.enable.idempotence=true
# Mesajın tüm replikalara yazıldığını onayla. Veri kaybını önler.
spring.kafka.producer.acks=all

# Consumer
spring.kafka.consumer.group-id=ecommerce-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Güvenilen paketler. '*' tümüne izin verir.
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# --- Loglama ve İzleme ---
# Belirli bir sınıf için log seviyesini artırarak hata ayıklamayı kolaylaştır.
logging.level.com.project.ecommerce_backend.business.concretes.OrderEventConsumerManager=DEBUG

# Zipkin (Dağıtık Takip)
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
# Örnekleme oranı. 1.0 = her şeyi izle (geliştirme), 0.1 = %10'unu izle (production).
management.tracing.sampling.probability=1.0
